# Override for the cloud server. Activated on the droplet by testbed/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.server.yml
#
# - Host networking: CompactLog listens directly on the droplet's interface,
#   with no Docker NAT/port-forwarding hop in the measured path. Access is
#   restricted by the DigitalOcean cloud firewall (experimenter IP only).
# - No auto-restart: a crash during a trial must be visible, not hidden.
# - Memory limit: leaves headroom for the OS. Set per droplet size with
#   CT_MEM_LIMIT in testbed/.env (default 6g for 8 GiB; 14g for 16 GiB).
#   CompactLog allocates ~1.5 GiB of heap per concurrent request on cold
#   reads (measured 2026-11-21: 0.3 -> 6 GiB in 2 s at 4 requests), so the
#   8 GiB droplet was OOM-killed on cold reads; C1 runs on 16 GiB.
# - Server config with a larger, explicit cache (Config.server.toml).
services:
  compactlog:
    network_mode: host
    ports: !reset []
    restart: "no"
    mem_limit: ${CT_MEM_LIMIT:-6g}
    volumes:
      - ./compactlog/Config.server.toml:/app/Config.toml:ro
