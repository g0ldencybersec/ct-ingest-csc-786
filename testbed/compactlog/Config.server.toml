# CompactLog configuration for the C1 testbed on the cloud server
# (DigitalOcean s-4vcpu-8gb: 4 vCPU, 8 GiB RAM). Mounted over the image's
# default Config.toml by docker-compose.server.yml.
#
# Validation is disabled on purpose: this log only ever receives certificates
# replayed from a public log, it is never trusted by any browser, and it is
# only reachable from the experimenter's IP (DigitalOcean cloud firewall).
# Disabling validation means no root store or temporal window is needed to
# accept the replayed slice.

[server]
bind_addr = "0.0.0.0:8080"
# Used to derive the checkpoint origin line.
base_url = "http://compactlog.testbed.local/"

[storage]
provider = "local"

[storage.local]
path = "/data"

[keys]
private_key_path = "/app/keys/private_key.pem"
public_key_path = "/app/keys/public_key.pem"

[validation]
enabled = false

# In-memory block cache for the storage engine. 1 GiB, with the rest of RAM
# left to the OS page cache. Recorded in run metadata.
#
# History: 2048 MB was used first. With it, CompactLog was OOM-killed at the
# 6 GiB container limit twice (2026-11-21 00:40 UTC reading all tiles at 8
# concurrent requests; 04:23 UTC during a C1 cold trial at 8 concurrent
# requests; anon RSS 3.2 / 2.7 GiB at kill). C1 therefore runs with 1024 MB
# and client concurrency 4. Both kills are reported as a serving-
# implementation finding.
[cache]
memory_block_cache_capacity_mb = 1024
